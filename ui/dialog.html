<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Strip Silence Edit</title>
<style>
  :root {
    --p-live-ui-bg: hsl(0,0%,21%);
    --p-live-control-bg: hsl(0,0%,16%);
    --p-live-input-bg: hsl(0,0%,12%);
    --p-live-text-primary: hsl(0,0%,71%);
    --p-live-text-secondary: hsl(0,0%,41%);
    --p-live-control-border: hsl(0,0%,7%);
    --p-live-accent-primary: hsl(31,100%,67%);
    --p-live-control-text--enabled: hsl(0,0%,7%);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    padding: 14px;
    background: var(--p-live-ui-bg);
    color: var(--p-live-text-primary);
    font-family: Arial, Helvetica, sans-serif;
    font-size: 12px;
    user-select: none;
  }
  .row { display: flex; align-items: center; margin-bottom: 10px; }
  label { width: 112px; color: var(--p-live-text-secondary); }
  input {
    flex: 1;
    min-width: 0;
    background: var(--p-live-input-bg);
    border: 1px solid var(--p-live-control-border);
    color: var(--p-live-text-primary);
    padding: 3px 6px;
    outline: none;
    user-select: text;
  }
  input:focus { border-color: var(--p-live-accent-primary); }
  .hint {
    margin-top: -4px;
    color: var(--p-live-text-secondary);
    font-size: 10px;
    line-height: 1.4;
  }
  .buttons { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
  button {
    background: var(--p-live-control-bg);
    border: 1px solid var(--p-live-control-border);
    color: var(--p-live-text-primary);
    font-size: 12px;
    padding: 4px 18px;
    cursor: pointer;
  }
  button:hover { color: #fff; }
  button.primary {
    background: var(--p-live-accent-primary);
    border-color: transparent;
    color: var(--p-live-control-text--enabled);
  }
</style>
</head>
<body>
  <div class="row">
    <label for="thresholdDb">Threshold (dB)</label>
    <input id="thresholdDb" type="number" step="any" value="__THRESHOLD_DB__">
  </div>
  <div class="row">
    <label for="headPadMs">Head pad (ms)</label>
    <input id="headPadMs" type="number" step="any" min="0" value="__HEAD_PAD__">
  </div>
  <div class="row">
    <label for="tailPadMs">Tail pad (ms)</label>
    <input id="tailPadMs" type="number" step="any" min="0" value="__TAIL_PAD__">
  </div>
  <div class="hint">Leave a padding field empty to use the safety padding from your config.</div>
  <div class="buttons">
    <button id="cancelBtn" type="button">Cancel</button>
    <button id="stripBtn" type="button" class="primary">Strip</button>
  </div>
<script>
  const wk = window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.live;
  const wv = window.chrome && window.chrome.webview;
  function send(message) {
    if (wk) wk.postMessage(message);
    else if (wv) wv.postMessage(message);
  }
  function closeWithResult(result) {
    send({ method: "close_and_send", params: [JSON.stringify(result)] });
  }
  function collect() {
    return {
      thresholdDb: document.getElementById("thresholdDb").value,
      headPadMs: document.getElementById("headPadMs").value,
      tailPadMs: document.getElementById("tailPadMs").value,
    };
  }
  document.getElementById("stripBtn").addEventListener("click", function () { closeWithResult(collect()); });
  document.getElementById("cancelBtn").addEventListener("click", function () { closeWithResult(null); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Enter") closeWithResult(collect());
    if (e.key === "Escape") closeWithResult(null);
  });
  const first = document.getElementById("thresholdDb");
  first.focus();
  first.select();
</script>
</body>
</html>
